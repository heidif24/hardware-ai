databases:
  - name: hardware-foundry-db
    plan: basic-256mb
    databaseName: hardware_foundry
    user: foundry
services:
  - type: web
    name: hardware-foundry-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hardware-foundry-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://hardware-foundry-heidif24.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: REPLICATE_API_TOKEN
        sync: false
