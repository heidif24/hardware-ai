version: "3.9"
services:
  engineering-worker:
    build: ./worker
    environment:
      PORT: "8080"
      JOBS_ROOT: /data/jobs
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?set-a-private-token}
      QT_QPA_PLATFORM: offscreen
    ports:
      - "8080:8080"
    volumes:
      - hardware_foundry_jobs:/data
volumes:
  hardware_foundry_jobs:
