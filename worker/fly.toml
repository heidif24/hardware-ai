app = "hardware-foundry-engineering-worker"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  JOBS_ROOT = "/data/jobs"
  QT_QPA_PLATFORM = "offscreen"

[[mounts]]
  source = "hardware_foundry_jobs"
  destination = "/data"
  initial_size = "20"

[[vm]]
  memory = "4096mb"
  cpu_kind = "performance"
  cpus = 2

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
